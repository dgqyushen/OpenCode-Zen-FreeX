name: tests

on:
  push:
    branches: [main]
  pull_request:

# Both jobs only read the repository, so the token is given nothing else.
permissions:
  contents: read

# A push supersedes the run it follows; a pull request does not, since two of
# them on one branch are two things being reviewed at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pinned to the commit v2.2.0 names: a tag can be moved under a workflow
      # that holds a token, and this one runs in both jobs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # These never touch the network: they are the plugin's own behaviour.
      - run: bun test

  # The free tier moves. This is how a move is noticed rather than reported.
  # It reports, it does not block: Zen being down is not this repository's fault,
  # and a failing build would train everyone to ignore it.
  gate:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun run check:gate