name: tests

on:
  push:
    branches: [main]
  pull_request:

# Both jobs only read the repository, so the token is given nothing else.
permissions:
  contents: read

# The Bun both jobs run at, in one place: the gate is only evidence about the
# commit if it asked from the same runtime the suite ran on (MAINTAINING.md).
env:
  BUN_VERSION: 1.4.3

# A push supersedes the run it follows; a pull request does not, since two of
# them on one branch are two things being reviewed at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every action here is pinned to the commit its version names: a tag can be
      # moved under a workflow that holds a token, and these run in both jobs.
      # checkout v5 moved to Node 24, so v4 was also running on a runtime GitHub
      # has deprecated; v7 needs a runner newer than v2.327.1, which a hosted one is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The two places the runtime is pinned are linked here: this env value and
      # `packageManager` in package.json. Nothing else compares them, so an upgrade
      # on one side alone would leave the suite and the gate running on a Bun the
      # project no longer declares and nothing would fail.
      - name: The pinned Bun is the one package.json declares
        run: |
          declared="$(node -p "require('./package.json').packageManager")"
          if [ "$declared" != "bun@$BUN_VERSION" ]; then
            echo "package.json declares $declared while this workflow pins $BUN_VERSION; bump both together." >&2
            exit 1
          fi
      # These never touch the network: they are the plugin's own behaviour.
      - run: bun test

  # The free tier moves. This is how a move is noticed rather than reported.
  # It reports, it does not block: Zen being down is not this repository's fault,
  # and a failing build would train everyone to ignore it.
  gate:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The step is allowed to fail, the job is not: a green run that says
      # nothing is worse than a red one, because the only check that notices Zen
      # moving would pass run after run. Its report goes to the run summary, so a
      # move is read where results are read rather than found by opening a log.
      # The verdict text matters as much as the exit code here: the gate also
      # exits non-zero when the free tier could not be reached at all, and only
      # the lines it printed tell a stale fingerprint from an outage.
      - name: Ask Zen which generations it still serves
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          bun run check:gate 2>&1 | tee gate-report.txt
      - name: Publish the gate's report
        if: always()
        run: |
          {
            echo "## Zen gate — ${{ steps.gate.outcome }}"
            echo
            if [ -s gate-report.txt ]; then
              echo '```'
              cat gate-report.txt
              echo '```'
            else
              echo 'The gate printed nothing, so it may never have asked. Read the job log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Note a gate that did not pass
        if: steps.gate.outcome == 'failure'
        # The one exit code covers several unrelated diagnoses — Zen has moved past
        # every generation, a `required` name has no tool behind it in
        # fingerprint.json, or the floor was rate-limited/5xx'd and never judged —
        # and the step outcome carries no cause. Naming one of them here is the
        # misdirection the gate's own verdict lines exist to prevent, so this says
        # where the cause is written instead of guessing at it.
        run: echo "::warning title=Zen gate did not pass::The gate did not pass; read the run summary — its verdict lines say whether Zen moved, which profile is malformed, or whether the free tier could not be judged."
