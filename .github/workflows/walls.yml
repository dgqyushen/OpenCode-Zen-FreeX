name: walls

# The free tier moves, and the limits table is what every host behind this plugin
# plans a conversation from. `ci.yml`'s gate notices that Zen has moved; this
# notices that a number in `limits.mjs` is no longer true, and by how much.
#
# It reports through a pull request rather than by committing. The table is not
# derived data — it is a set of measurements a person took, and a value a
# scheduled job wrote on its own is a value nobody has ever checked. What is
# automated here is the measuring, which is the part that costs an afternoon and
# a million tokens; the deciding stays with whoever merges the branch.
on:
  schedule:
    # Hourly, at :17. The minute is not :00 because every scheduled workflow in
    # the world asks at :00, and this one spends somebody's shared free
    # credential on megabyte-sized prompts.
    #
    # Hourly is affordable because of what the default run does not do. Without
    # `--all` it measures the ids the listing offers and the snapshot does not
    # name yet, PLUS the ids whose wall was never found: a snapshot row that says
    # `openEnded` while the catalogue declares more than the snapshot ever
    # served is an id whose wall is one rung up, so those are measured again
    # rather than left open.
    #
    # What it does NOT do is measure the ids the catalogue declares at a million
    # or more. Those are answered from models.dev — the largest entry any
    # provider declares for the same canonical model — and only an id the
    # catalogue declares BELOW a million is measured, because only there can a
    # measurement change the answer. The run of 2026-10-20 asked
    # `minimax-m3.1-flash-free`, `beam-free` and `nemotron-3.5-super-vl-free`
    # anyway and spent eleven megabytes of prompts and half an hour of runner
    # time to learn the 1,048,576 the catalogue already said; the rule now
    # holds for `--all` as well, and at the layer that makes the requests.
    #
    # An hour in which Zen added nothing and nothing is open costs one listing
    # read and thirteen seconds - that is the measured cost of a run that finds
    # nothing to measure. What this frequency does not buy is a fresh reading of
    # a wall that moved under an id already measured: that is `--all`, and it
    # stays a person's dispatch because re-measuring every measurable id every
    # hour is an hour of megabyte prompts for an answer that rarely changes.
    - cron: "17 * * * *"
  # The way to find out whether this works without waiting for the next hour, and
  # the way to re-measure one model by hand: run it from the Actions page.
  workflow_dispatch:
    inputs:
      sweep_all:
        description: Re-measure every id that may be measured, not only the ones with no measurement
        type: boolean
        default: false

# A scheduled run has no user waiting for it, so it must not be able to cancel
# the previous one halfway through a measurement, and two of them must not spend
# the route's budget at once.
concurrency:
  group: walls
  cancel-in-progress: false

# The default for anything in this file that is not overridden: this workflow
# reads a repository and asks Zen. `measure` overrides it below, because opening
# the pull request is the one thing here that writes anything.
permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3

jobs:
  measure:
    runs-on: ubuntu-latest
    # Job-level rather than step-level, because GitHub scopes permissions to the
    # job and not to a step: every step in here holds these, and the honest fix
    # for that is a job that only measures and a second one that only publishes.
    # That split is not here yet — it is one job because the measurement has to
    # reach the publisher through the working tree, and putting the write token
    # on a job whose only output is a file is the smaller of the two costs.
    permissions:
      contents: write
      pull-requests: write
    # Ten models, up to fourteen requests each, five seconds apart, and a
    # 180-second abort per request — and the requests are not all quick: a
    # million-token prompt takes the route 40 to 110 seconds to count, so the
    # arithmetic is not requests times five seconds but requests times (pace
    # plus the time the route takes to read the prompt). Measured 2026-10-20, a
    # full re-measurement of ten ids ran past twenty-seven minutes and was still
    # going; forty-five was what the old ladder's arithmetic asked for, and the
    # new ladder asks for more. A job killed by its own timeout reports nothing
    # at all, which is the one outcome worse than a partial one.
    timeout-minutes: 120
    steps:
      # Pinned to the commit its version names, as in `ci.yml`: a tag can be moved
      # under a workflow that holds a token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The trio the gate reports on: whether the route still offers what the
      # table describes, which ids have never been measured, and — for the ones
      # that have not — where their wall is.
      #
      # Allowed to fail, and the job is not: Zen being unreachable is not this
      # repository's fault, and a red scheduled build is one everybody learns to
      # ignore. What the step printed is the finding either way.
      - name: What is offered, against what was measured
        id: watch
        continue-on-error: true
        # `--all` re-measures every offered id; the scheduled run measures only
        # the ids that have never been measured, which is the whole reason the
        # snapshot exists. `inputs.sweep_all` is empty on a schedule and a boolean
        # on a dispatch, so the comparison is against `true` rather than truthy.
        env:
          ALL: ${{ inputs.sweep_all == true && '--all' || '' }}
        run: |
          set -o pipefail
          bun limits-watch.mjs --sweep $ALL --write 2>&1 | tee watch-report.txt
      - name: Publish the report
        if: always()
        run: |
          {
            echo "## Wall survey — ${{ steps.watch.outcome }}"
            echo
            echo '```'
            cat watch-report.txt 2>/dev/null || echo 'The run printed nothing, so it may never have asked.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A run that could not ask says so, and stops rather than opening a pull
      # request about a route it never reached.
      - name: Stop when the route was not reached
        if: steps.watch.outcome == 'failure'
        run: |
          echo "::warning title=Wall survey did not finish::The survey did not finish; read the run summary for what it managed to ask."
          exit 1
      - name: Is there anything to show?
        id: diff
        run: |
          if git diff --quiet -- limits-observed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing measured has changed, so there is nothing to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- limits-observed.json
          fi
      # A repository can forbid Actions from opening pull requests — it forbids it
      # by default, and this workflow met that: the branch pushed and the pull
      # request was refused, which reddened a run whose measurement was fine. So
      # the refusal is reported as what to do about it rather than as a failure,
      # and the link goes to the run summary. A repository that has allowed it
      # gets the pull request; one that has not gets a branch and a link, which is
      # a person's click rather than a red run.
      #
      # It then merges what it opened, which is what makes a timer worth having: a
      # window that waits for somebody to click is a window a new model does not
      # get, and the run that found it is the one that knows what it found. Two
      # things make an unattended merge safe, and neither is a promise. The pull
      # request is the snapshot and nothing else, checked against what GitHub says
      # the pull request changes rather than assumed, and left for a person if that
      # guard ever fails. And the numbers themselves are bounded by construction:
      # a row's value is a size the route was watched to serve, floored, so it can
      # never be above one, and the table still has the first word for every id it
      # names. A repository that wants the click anyway sets the variable
      # WALLS_AUTOMERGE to `off`; nothing else about the run changes.
      - name: Open a pull request with the measurement
        id: open
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="walls/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add limits-observed.json
          git commit -m "chore: record the walls measured on $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "compare=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1" >> "$GITHUB_OUTPUT"
          {
            echo "A scheduled survey measured the free tier on $(date -u +%Y-%m-%d) and found something"
            echo "that is not what the last run recorded."
            echo
            echo "**What is in this pull request is the snapshot, and the snapshot is read.**"
            echo "\`limits-observed.json\` is an input at run time and not only a report: for an id"
            echo "\`limits.mjs\` does not name, or an axis whose catalogue value has moved since its"
            echo "entry was written, this is the window a host is told, so merging is what"
            echo "publishes those numbers. Where \`limits.mjs\` does name an id its entry keeps the"
            echo "first word, because the samples behind it are there - a measurement here that"
            echo "contradicts one of those entries is the reason to rewrite the entry."
            echo
            echo '```'
            cat watch-report.txt
            echo '```'
            echo
            echo "The rules the sweep applies — a failure that is not about a size is not a"
            echo "refusal, a refusal is asked twice before it counts, a wall needs two refused"
            echo "sizes behind a served one, fifteen requests per model — are in"
            echo "\`limits-sweep.mjs\`. A bracket this run could not narrow is reported as"
            echo "\`single-refusal\` rather than smoothed into a wall, and an upstream that is"
            echo "failing shows up as \`openEnded\` rather than as a small window."
          } > pr-body.md
          opened=false
          if gh pr create --title "walls: the free tier moved on $(date -u +%Y-%m-%d)" --body-file pr-body.md --base main --head "$branch"; then
            opened=true
          else
            echo "::warning title=Pull request not opened::This repository does not let GitHub Actions open pull requests, so the branch was pushed and no pull request was made. Open it from the link in the run summary, or allow it under Settings > Actions > General > Workflow permissions."
          fi
          echo "opened=$opened" >> "$GITHUB_OUTPUT"
          merged=false
          if [ "${{ vars.WALLS_AUTOMERGE }}" = "off" ]; then
            echo "::notice title=Merge left to a person::WALLS_AUTOMERGE is off for this repository, so the pull request was left open."
          elif [ "$opened" = "true" ]; then
            paths=$(gh pr view "$branch" --json files --jq '[.files[].path] | join(",")')
            if [ "$paths" = "limits-observed.json" ]; then
              # Mergeability is computed after the pull request exists, so the first
              # ask can come back with nothing to merge yet.
              for attempt in 1 2 3 4; do
                if gh pr merge "$branch" --squash; then merged=true; break; fi
                sleep 5
              done
              if [ "$merged" = "true" ]; then
                git push origin --delete "$branch" >/dev/null 2>&1 || true
              else
                echo "::warning title=Not merged automatically::The pull request for $branch could not be merged by this run; it was left open. Merge it from the run summary."
              fi
            else
              echo "::warning title=Not merged automatically::This pull request changes $paths, which is more than limits-observed.json, so the run left it for a person."
            fi
          fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
      - name: Where the measurement is
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo
            echo "## Where the measurement is"
            echo
            if [ "${{ steps.open.outputs.merged }}" = "true" ]; then
              echo "This run measured something new and merged it to \`main\`: \`${{ steps.open.outputs.branch }}\`"
              echo "was opened as a pull request, checked to be the snapshot and nothing else, squashed"
              echo "and its branch deleted."
            elif [ "${{ steps.open.outputs.opened }}" = "true" ]; then
              echo "A pull request was opened for \`${{ steps.open.outputs.branch }}\` and left for a person to"
              echo "merge, either because \`WALLS_AUTOMERGE\` is \`off\` or because the run could not merge it."
            else
              echo "This repository does not let GitHub Actions open pull requests, so the branch"
              echo "\`${{ steps.open.outputs.branch }}\` was pushed and the pull request is a click:"
              echo
              echo "${{ steps.open.outputs.compare }}"
            fi
            echo
            echo "\`limits-observed.json\` is not only a report. The plugin reads it when it"
            echo "starts, so a measurement on \`main\` is the window a host shows for an id"
            echo "\`limits.mjs\` does not name - which is what a model Zen made free after this"
            echo "table was written is. Until it is there, the catalogue's own numbers are what"
            echo "is published for those ids."
          } >> "$GITHUB_STEP_SUMMARY"
