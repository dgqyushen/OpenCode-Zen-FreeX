name: walls

# The free tier moves, and the limits table is what every host behind this plugin
# plans a conversation from. `ci.yml`'s gate notices that Zen has moved; this
# notices that a number in `limits.mjs` is no longer true, and by how much.
#
# It reports through a pull request rather than by committing. The table is not
# derived data — it is a set of measurements a person took, and a value a
# scheduled job wrote on its own is a value nobody has ever checked. What is
# automated here is the measuring, which is the part that costs an afternoon and
# a million tokens; the deciding stays with whoever merges the branch.
on:
  schedule:
    # Hourly, at :17. The minute is not :00 because every scheduled workflow in
    # the world asks at :00, and this one spends somebody's shared free
    # credential on megabyte-sized prompts.
    #
    # Hourly is affordable because of what the default run does not do. Without
    # `--all` it measures the ids the listing offers and the snapshot does not
    # name yet, PLUS the ids whose wall was never found: a snapshot row that says
    # `openEnded` while the catalogue declares more than the snapshot ever
    # served is an id whose wall is one rung up, so those are measured again
    # rather than left open — but at most once a week, because the ladder is
    # the same on every run and only the catalogue's number and the route's own
    # build change, and neither of those is an hourly event. An id that is
    # still open after a week is one the free tier has not moved for, and
    # paying for it every hour says nothing the weekly run does not.
    #
    # What it does NOT do is measure the ids the catalogue declares at a million
    # or more. Those are answered from models.dev — the largest entry any
    # provider declares for the same canonical model — and only an id the
    # catalogue declares BELOW a million is measured, because only there can a
    # measurement change the answer. The run of 2026-10-20 asked
    # `minimax-m3.1-flash-free`, `beam-free` and `nemotron-3.5-super-vl-free`
    # anyway and spent eleven megabytes of prompts and half an hour of runner
    # time to learn the 1,048,576 the catalogue already said; the rule now
    # holds for `--all` as well, and at the layer that makes the requests. An id
    # answered from models.dev is not "new" either: it is never measured here,
    # so it is never work this run has left to do.
    #
    # An hour in which Zen added nothing and nothing is open costs one listing
    # read and thirteen seconds - that is the measured cost of a run that finds
    # nothing to measure. What this frequency does not buy is a fresh reading of
    # a wall that moved under an id already measured: that is `--all`, and it
    # stays a person's dispatch because re-measuring every measurable id every
    # hour is an hour of megabyte prompts for an answer that rarely changes.
    - cron: "17 * * * *"
  # The way to find out whether this works without waiting for the next hour:
  # run it from the Actions page. The default dispatch is the incremental sweep
  # the schedule runs — ids with no measurement, plus open rows the catalogue
  # says are worth another rung. `sweep_all=true` re-measures every id that may
  # be measured. There is no single-model input here; measuring one id by hand
  # is `bun run limits:sweep <id>` from a checkout.
  workflow_dispatch:
    inputs:
      sweep_all:
        description: Re-measure every id that may be measured, not only the ones with no measurement
        type: boolean
        default: false
      automatic:
        description: A scheduler-triggered run; skip if a successful run happened in the last 55 minutes
        type: boolean
        default: false

# A scheduled run has no user waiting for it, so it must not be able to cancel
# the previous one halfway through a measurement, and two of them must not spend
# the route's budget at once.
concurrency:
  group: walls
  cancel-in-progress: false

# The default for anything in this file that is not overridden: this workflow
# reads a repository and asks Zen. `measure` overrides it below, because opening
# the pull request is the one thing here that writes anything.
permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3

jobs:
  # GitHub's cron is best effort and has been arriving every three to five hours
  # on this repository. A deployment that needs the interval can dispatch this
  # workflow with `automatic=true` from its own timer; the guard below is the
  # interval itself, so a cron that arrives late, a timer that fires on time,
  # and both together still cost one measurement, not two. Manual dispatch
  # leaves `automatic=false` and bypasses the guard, because a person asking is
  # not the timer asking.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Is this a run the interval still needs?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          AUTOMATIC: ${{ inputs.automatic == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$AUTOMATIC" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: the interval guard is bypassed"
            exit 0
          fi
          if [ "$EVENT" != "schedule" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail open: an actions API the guard cannot read must not stop the
          # only measurement the project has.
          set +e
          # `updatedAt`, not `createdAt`: a run that took longer than the
          # interval was created long before it finished, and the trigger that
          # queued behind it would read that old start as "the interval has
          # passed" and measure again. Completion is when the interval the
          # guard enforces actually restarts. `gh run list` answers runs ordered
          # by creation, so the newest completion is not `.[0]`: a window of
          # runs is read and the latest completion among them is what the
          # interval restarts from. No success yet is no output, which is the
          # fail-open above.
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=walls.yml --status=success --limit 30 --json updatedAt --jq '([.[].updatedAt] | sort | last) // empty' 2>/dev/null)"
          code=$?
          set -e
          if [ "$code" -ne 0 ] || [ -z "$last" ]; then
            echo "::warning title=Interval guard could not read runs::measuring rather than skipping"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          if [ "$age" -lt 3300 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "the last successful walls run finished ${age}s ago; this trigger is a duplicate"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "the last successful walls run finished ${age}s ago"
          fi

  measure:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Job-level rather than step-level, because GitHub scopes permissions to the
    # job and not to a step: every step in here holds these, and the honest fix
    # for that is a job that only measures and a second one that only publishes.
    # That split is not here yet — it is one job because the measurement has to
    # reach the publisher through the working tree, and putting the write token
    # on a job whose only output is a file is the smaller of the two costs.
    permissions:
      contents: write
      pull-requests: write
    # Ten models, up to fourteen requests each, five seconds apart, and a
    # 180-second abort per request — and the requests are not all quick: a
    # million-token prompt takes the route 40 to 110 seconds to count, so the
    # arithmetic is not requests times five seconds but requests times (pace
    # plus the time the route takes to read the prompt). Measured 2026-10-20, a
    # full re-measurement of ten ids ran past twenty-seven minutes and was still
    # going; forty-five was what the old ladder's arithmetic asked for, and the
    # new ladder asks for more. A job killed by its own timeout reports nothing
    # at all, which is the one outcome worse than a partial one.
    timeout-minutes: 120
    steps:
      # Pinned to the commit its version names, as in `ci.yml`: a tag can be moved
      # under a workflow that holds a token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The measurement is the default branch's, whatever ref the dispatch
          # named: a run from another branch must not publish that branch's
          # scripts or `limits-observed.json` with this job's write token. The
          # workflow file itself still comes from the dispatched ref, so
          # structural changes remain testable; the data and the scripts that
          # write it come from `main`.
          ref: ${{ github.event.repository.default_branch }}
          # The token is not needed after the clone, and the step that follows
          # runs a script that asks the network and writes a file. The job's
          # permissions are `contents: write` and `pull-requests: write`, so the
          # credential left in `.git/config` by default is a write credential
          # sitting in the working tree the measurement process can read. The
          # publish step authenticates for itself, where it needs the token.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The pin in this file is the fourth place the version is named — `ci.yml`
      # pins the same value and `package.json` names the manager, while nothing
      # compared this workflow's copy. A scheduled measurement that ran on an
      # undeclared Bun would auto-merge its numbers into `main`, which is exactly
      # the drift the assertion exists to stop on the other side, so the same
      # script the test jobs run runs here too.
      - name: The pinned Bun is the one package.json declares
        run: bun assert-bun-version.mjs "$BUN_VERSION"
      # Before the survey reaches the network, the snapshot and this script's own
      # reader are checked with no network at all. A `limits-observed.json` that
      # is not what the plugin will read, or a `limits-watch.mjs` that cannot read
      # it, is a repository fault; it must fail loudly here rather than be folded
      # into the survey's "the route could not be asked" and disappear from a
      # green scheduled run. The survey below stays allowed to fail; this does
      # not, because a fault in our own files is not the route's fault.
      - name: The snapshot is one the plugin can read
        run: bun limits-watch.mjs --check
      # The trio the gate reports on: whether the route still offers what the
      # table describes, which ids have never been measured, and — for the ones
      # that have not — where their wall is.
      #
      # Allowed to fail, and the job is not: Zen being unreachable is not this
      # repository's fault, and a red scheduled build is one everybody learns to
      # ignore. What the step printed is the finding either way, and its exit
      # code is preserved as an output because it carries the distinction the
      # step colour cannot: 0 is a route that answered with ids to consider,
      # 2 is a route that answered and offered no free ids, everything else is
      # a route that could not be asked.
      - name: What is offered, against what was measured
        id: watch
        continue-on-error: true
        # `--all` re-measures every offered id; the scheduled run measures only
        # the ids that have never been measured, which is the whole reason the
        # snapshot exists. `inputs.sweep_all` is empty on a schedule and a boolean
        # on a dispatch, so the comparison is against `true` rather than truthy.
        env:
          ALL: ${{ inputs.sweep_all == true && '--all' || '' }}
        run: |
          # The exit code is read, not left to the colour of the step. `set +e`
          # keeps the runner's implicit `-e` from ending the step before the
          # code is captured, and `PIPESTATUS[0]` is the script's own answer
          # rather than `tee`'s. Exiting with it afterwards keeps the outcome
          # informative (0 success, 2 failure-but-answered), while
          # `continue-on-error` keeps the job green either way.
          set +e
          set -o pipefail
          bun limits-watch.mjs --sweep $ALL --write 2>&1 | tee watch-report.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      # The survey's own exit code is shown beside the step outcome, because the
      # outcome cannot tell 1 (could not ask) from 2 (asked, nothing offered):
      # both are a failed step under `continue-on-error`. The report quotes the
      # route's own text (`limits-watch` prints up to 400 characters of a
      # response body), so it is rendered indented rather than inside a ``` fence:
      # a line of route text can close a fence and inject markdown into the run
      # summary. Indentation has no closing token.
      - name: Publish the report
        if: always()
        env:
          OUTCOME: ${{ steps.watch.outcome }}
          CODE: ${{ steps.watch.outputs.code }}
        run: |
          {
            if [ -n "$CODE" ]; then
              echo "## Wall survey — $OUTCOME (exit code $CODE)"
            else
              echo "## Wall survey — $OUTCOME"
            fi
            echo
            echo "The report below quotes what the survey printed; it is text from this branch and the route, not interpreted."
            echo
            sed 's/^/    /' watch-report.txt 2>/dev/null || echo 'The run printed nothing, so it may never have asked.'
          } >> "$GITHUB_STEP_SUMMARY"
      # A run that could not ask says so, and stops rather than opening a pull
      # request about a route it never reached.
      #
      # A run that could not ask publishes nothing — but it does not fail the
      # build. This contradicts the policy stated twice in this file ("Allowed
      # to fail, and the job is not: … a red scheduled build is one everybody
      # learns to ignore"), and a red build is the one alarm everybody learns to
      # ignore. Zen being unreachable is not this repository's fault.
      #
      # The script's exit code is the only signal there is, so it is read here
      # and turned into an output the publish steps are gated on: what decides
      # whether anything is published is the fact that the route was reached,
      # not the colour of the run. The survey also writes the snapshot before
      # it exits non-zero, so a run that asked nothing has still touched the
      # file — which is another reason the publish steps, not the build, are
      # where the answer to that is given. Code 2 is the state this file used to
      # collapse into "unreached": the route answered and simply offered no free
      # ids. Nothing is published for it, but it was reached, and it is a
      # successful ask with nothing to show rather than an outage.
      - name: Stop when the route was not reached
        id: reached
        if: always()
        env:
          # Read through the environment rather than spliced into the script:
          # the value is workflow-derived today, but a value that reaches a
          # shell through an interpolation is a value that can reach it as code.
          CODE: ${{ steps.watch.outputs.code }}
        run: |
          reached=false
          if [ "$CODE" = "0" ] || [ "$CODE" = "2" ]; then
            reached=true
          fi
          echo "reached=$reached" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "2" ]; then
            echo "::warning title=No free ids were offered::The route answered but offered no free ids; nothing published."
          elif [ "$reached" != "true" ]; then
            # The empty code is the survey that never ran — the pre-check above
            # failed, or the job stopped before it. That is still "not reached"
            # for the purpose of publishing, and the loud failure is elsewhere.
            echo "::warning title=Wall survey did not reach the route::The survey did not finish (exit code \`$CODE\`); read the run summary for what it managed to ask. Nothing is published."
          fi
      - name: Is there anything to show?
        id: diff
        # Code 2 is a route that answered and offered no free ids: there is no
        # measurement to publish for it, even if the snapshot on disk happens to
        # differ — an edit produced from an empty listing is not a measurement
        # this run should carry. The warning above is the whole report; gating
        # here is what makes "nothing published" true rather than inferred.
        if: steps.reached.outputs.reached == 'true' && steps.watch.outputs.code == '0'
        run: |
          if git diff --quiet -- limits-observed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing measured has changed, so there is nothing to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- limits-observed.json
          fi
      # The snapshot is not a report: `limits.mjs` reads it at run time, so
      # whatever lands here becomes the window a host is told for an id the table
      # does not name. It is checked before it is published, and the suite runs
      # over it, because nothing else does: a workflow started with
      # `GITHUB_TOKEN` does not start a workflow, so the pull request this run
      # opens runs no `ci.yml` of its own and the squash merge produces no
      # `push` run either. The numbers are bounded by construction — that is an
      # invariant of `limits-sweep.mjs` — but an invariant is not the same as a
      # check on the artifact that is about to be published.
      - name: Is the measurement publishable?
        if: steps.reached.outputs.reached == 'true' && steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bun limits-watch.mjs --check
          bun test
      # A repository can forbid Actions from opening pull requests — it forbids it
      # by default, and this workflow met that: the branch pushed and the pull
      # request was refused, which reddened a run whose measurement was fine. So
      # the refusal is reported as what to do about it rather than as a failure,
      # and the link goes to the run summary. A repository that has allowed it
      # gets the pull request; one that has not gets a branch and a link, which is
      # a person's click rather than a red run.
      #
      # It then merges what it opened or reused, which is what makes a timer
      # worth having: a window that waits for somebody to click is a window a new
      # model does not get, and the run that found it is the one that knows what
      # it found. Two things make an unattended merge safe, and neither is a
      # promise. The pull request is the snapshot and nothing else, checked
      # against what GitHub says the pull request changes rather than assumed,
      # and left for a person if that guard ever fails. And the numbers
      # themselves are bounded by construction: a row's value is a size the route
      # was watched to serve, floored, so it can never be above one, and the
      # table still has the first word for every id it names. A repository that
      # wants the click anyway sets the variable WALLS_AUTOMERGE to `off`;
      # nothing else about the run changes.
      - name: Open a pull request with the measurement
        id: open
        if: steps.reached.outputs.reached == 'true' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The variable is read from the environment rather than interpolated
          # into the script: a free-text repository value spliced into a `run:`
          # block is the classic expression-injection shape, and the value is
          # not supposed to be code. It is set by an administrator rather than
          # by a pull request, so it is not an attacker-controlled path today —
          # but the fix costs one line and the shape is what causes accidents.
          WALLS_AUTOMERGE: ${{ vars.WALLS_AUTOMERGE }}
          # The base the pull request is opened against, from the same
          # expression the checkout measures from. A literal `main` here would
          # diverge from the checkout the day the default branch is renamed, and
          # the pull request would name a branch that no longer exists.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The checkout dropped the credential, so the push has to authenticate
          # for itself. `gh` is already the tool this step uses to open and to
          # merge the pull request, and `gh auth setup-git` points git at the
          # same credential — the token never has to be written into
          # `.git/config` by hand, and it is not lying in the working tree the
          # measurement step could read.
          gh auth setup-git
          # One branch for the measurement, always the same name. A per-run
          # branch name made every unmerged hour a new branch and a new pull
          # request; a fixed one makes every run an update of the same pull
          # request, and re-running a failed run an update of the same branch
          # rather than a non-fast-forward collision with it. The branch is
          # machine-owned: the only writer is this job, and the concurrency group
          # above keeps two runs from writing it at once.
          branch="walls/observed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The measurement is in the working tree and uncommitted. Copy it
          # aside before moving the checkout to the rolling branch: a checkout
          # over a modified tracked file is refused, and the branch's copy of
          # limits-observed.json is not the one this run just measured.
          measurement="$(mktemp)"
          cp limits-observed.json "$measurement"
          git checkout -- limits-observed.json
          # Continue from the machine-owned branch when there is one, so the new
          # measurement lands on top of what the open pull request already has;
          # otherwise start from the commit this job checked out (the default
          # branch on a schedule, as this workflow only runs there and on a
          # dispatch). The fetch is shallow for the same reason the checkout is:
          # the branch's parent is on the server, so the push still has all it
          # needs.
          # `git ls-remote --exit-code` answers 2 for "no such ref" and a
          # different non-zero (128 and friends) when the query itself failed.
          # The two are not the same fact: a branch that is not there starts
          # from this checkout, while a remote that could not be asked must not
          # be read as one — force-pushing a main-based branch over a rolling
          # branch that was never fetched would drop the measurement it
          # carries.
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          remote_code=$?
          set -e
          if [ "$remote_code" -eq 0 ]; then
            git fetch --depth=1 --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"
          elif [ "$remote_code" -eq 2 ]; then
            git checkout -B "$branch"
          else
            echo "::error title=Could not read the rolling branch::git ls-remote failed (status $remote_code); the measurement was not published."
            exit 1
          fi
          cp "$measurement" limits-observed.json
          rm -f "$measurement"
          git add limits-observed.json
          if git diff --cached --quiet; then
            echo "The rolling branch already carries exactly this measurement, so there is no new commit."
          else
            git commit -m "chore: record the walls measured on $(date -u +%Y-%m-%d)"
          fi
          # Force, because this branch is the workflow's own file: a re-run has
          # to replace the tip a failed run left behind, and a branch this run
          # rebuilt from main may not be a descendant of the old tip.
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "compare=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${branch}?expand=1" >> "$GITHUB_OUTPUT"
          {
            echo "A scheduled survey measured the free tier on $(date -u +%Y-%m-%d) and found something"
            echo "that is not what the last run recorded."
            echo
            echo "**What is in this pull request is the snapshot, and the snapshot is read.**"
            echo "\`limits-observed.json\` is an input at run time and not only a report: for an id"
            echo "\`limits.mjs\` does not name, or an axis whose catalogue value has moved since its"
            echo "entry was written, this is the window a host is told, so merging is what"
            echo "publishes those numbers. Where \`limits.mjs\` does name an id its entry keeps the"
            echo "first word, because the samples behind it are there - a measurement here that"
            echo "contradicts one of those entries is the reason to rewrite the entry."
            echo
            # The report is a convenience, and its absence must not take the
            # publish step down with it: the branch is already pushed by the
            # time this runs, so a failure here would leave an orphan branch
            # and no summary saying that the branch exists. It is indented
            # rather than fenced for the reason the run summary is: a line of
            # route text can close a fence and inject markdown into a
            # bot-authored pull request.
            sed 's/^/    /' watch-report.txt 2>/dev/null || echo '    The survey printed no report.'
            echo
            echo "The rules the sweep applies — a failure that is not about a size is not a"
            echo "refusal, a refusal is asked twice before it counts, a wall needs two refused"
            echo "sizes behind a served one, fourteen requests per model — are in"
            echo "\`limits-sweep.mjs\`. A bracket this run could not narrow is reported as"
            echo "\`single-refusal\` rather than smoothed into a wall, and an upstream that is"
            echo "failing shows up as \`openEnded\` rather than as a small window."
          } > pr-body.md
          # Reuse the open pull request for this branch when there is one. The
          # fixed branch already makes a later run an update of the same pull
          # request, but `gh pr create` would still fail on an existing one, so
          # the number is looked up first and creation is the fallback. The
          # lookup is allowed to fail: a failure to read pull requests is
          # reported and treated as "none found", not as a red run about a
          # measurement that was fine.
          existing=""
          set +e
          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')"
          list_code=$?
          set -e
          if [ "$list_code" -ne 0 ]; then
            echo "::warning title=Could not look for an existing pull request::gh pr list failed (status $list_code); the run will try to create one."
            existing=""
          fi
          opened=false
          number=""
          if [ -n "$existing" ]; then
            number="$existing"
            echo "::notice title=Reusing the open pull request::Pull request #$number already has $branch as its head; this run updated that pull request."
            opened=true
          elif creation="$(gh pr create --title "walls: the free tier moved on $(date -u +%Y-%m-%d)" --body-file pr-body.md --base "$DEFAULT_BRANCH" --head "$branch" 2>&1)"; then
            opened=true
            # `gh pr create` prints the new pull request's URL on stdout, and
            # stderr was merged in so a refusal can be reported below: a warning
            # printed beside the URL must not become part of the number. The
            # URL line is found by shape instead of by splitting the whole blob.
            # `grep` answers 1 for "no match", which is a shape this step has to
            # keep walking through — the warning below is what reports it — and
            # under `set -e` a failing pipeline would end the step before that.
            set +e
            number="$(printf '%s' "$creation" | grep -oE '/pull/[0-9]+$' | tail -n 1 | grep -oE '[0-9]+$')"
            set -e
            if [ -n "$number" ]; then
              echo "::notice title=Pull request opened::Pull request #$number carries $branch."
            else
              echo "::warning title=Could not read the new pull request number::gh pr create succeeded but its output did not name a pull request; the branch was pushed and the pull request was left for a person."
            fi
          else
            echo "::warning title=Pull request not opened::gh pr create failed ($(printf '%s' "$creation" | tail -n 1)), so the branch was pushed and no pull request was made. Open it from the link in the run summary. If the message names Actions permissions, allow them under Settings > Actions > General > Workflow permissions."
          fi
          echo "opened=$opened" >> "$GITHUB_OUTPUT"
          merged=false
          if [ "$WALLS_AUTOMERGE" = "off" ]; then
            echo "::notice title=Merge left to a person::WALLS_AUTOMERGE is off for this repository, so the pull request was left open."
          elif [ "$opened" = "true" ] && [ -n "$number" ]; then
            # Read the files the pull request actually changes, by number for
            # the same reason the state is read that way: a branch lookup sees
            # only an open pull request, and the number was captured above.
            # The read is allowed to fail, and a failed read is not evidence
            # that the pull request is only the snapshot: it is a reason to
            # leave it alone.
            paths=""
            set +e
            paths="$(gh pr view "$number" --json files --jq '[.files[].path] | join(",")' 2>/dev/null)"
            view_code=$?
            set -e
            if [ "$view_code" -ne 0 ]; then
              echo "::warning title=Could not read the pull request files::gh pr view #$number failed (status $view_code), so the pull request was left for a person."
              paths=""
            fi
            if [ -z "$paths" ]; then
              # A path list that could not be read is not a pull request that
              # changes nothing; it is a pull request whose contents are
              # unknown, and merging it unattended is the one thing this guard
              # exists to refuse.
              echo "::warning title=Not merged automatically::The files changed by pull request #$number could not be read, so it was left for a person."
            elif [ "$paths" = "limits-observed.json" ]; then
              # Mergeability is computed after the pull request exists, so the
              # first ask can come back with nothing to merge yet.
              merge_state=""
              for attempt in 1 2 3 4; do
                merge_output=""
                set +e
                merge_output="$(gh pr merge "$number" --squash 2>&1)"
                merge_code=$?
                set -e
                if [ "$merge_code" -ne 0 ]; then
                  echo "::notice title=Merge not accepted yet::attempt $attempt of 4: $(printf '%s' "$merge_output" | tail -n 1)"
                  sleep 5
                  continue
                fi
                # A zero exit from `gh pr merge` covers a merge that was only
                # queued (branch protection, a required check on the way) as
                # well as one that landed. Only the pull request's own state
                # says which happened, and only a merged one may report merged.
                # By number, not by branch: `gh pr view <branch>` resolves a
                # branch to an OPEN pull request, and the one this run just
                # merged is no longer open.
                merge_state="unreadable"
                set +e
                merge_state="$(gh pr view "$number" --json state,mergedAt --jq 'if .state == "MERGED" and .mergedAt != null then "merged" else "not-merged" end' 2>/dev/null)"
                state_code=$?
                set -e
                if [ "$state_code" -eq 0 ] && [ "$merge_state" = "merged" ]; then
                  merged=true
                  merge_state="merged"
                elif [ "$state_code" -eq 0 ]; then
                  merge_state="queued"
                else
                  # The state could not be read, so this cannot say it merged:
                  # `merged` stays false.
                  echo "::warning title=Could not read the pull request state::gh pr view #$number failed (status $state_code); the run will not claim a merge it cannot see."
                  merge_state="unreadable"
                fi
                break
              done
              if [ "$merged" = "true" ]; then
                git push origin --delete "$branch" >/dev/null 2>&1 || true
              elif [ "$merge_state" = "queued" ]; then
                echo "::warning title=Not merged automatically::The merge of #$number was accepted but the pull request is not merged yet; it may be queued behind branch protection. The branch and the pull request were left in place."
              else
                echo "::warning title=Not merged automatically::The pull request #$number could not be merged by this run; it was left open. Merge it from the run summary."
              fi
            else
              echo "::warning title=Not merged automatically::This pull request changes $paths, which is more than limits-observed.json, so the run left it for a person."
            fi
          fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
      - name: Where the measurement is
        # `always()` is what makes this a summary of the publish attempt rather
        # than of a successful publish: without a status function the implicit
        # `success()` would skip this step when the step above failed, which is
        # exactly the run where a reader needs to be told where the measurement
        # did (or did not) go. The reached/changed conditions still decide
        # whether there was anything to say at all.
        if: always() && steps.reached.outputs.reached == 'true' && steps.diff.outputs.changed == 'true'
        # The step's own outputs are read from the environment rather than
        # spliced into the script: they are workflow-derived today, but a value
        # that reaches a shell through an interpolation is a value that can
        # reach it as code, and keeping them in `env:` costs nothing.
        env:
          MERGED: ${{ steps.open.outputs.merged }}
          OPENED: ${{ steps.open.outputs.opened }}
          OUTCOME: ${{ steps.open.outcome }}
          BRANCH: ${{ steps.open.outputs.branch }}
          COMPARE: ${{ steps.open.outputs.compare }}
        run: |
          {
            echo
            echo "## Where the measurement is"
            echo
            if [ "$MERGED" = "true" ]; then
              echo "This run measured something new and merged it to \`main\`: the rolling branch"
              echo "\`$BRANCH\` was updated, its pull request checked to be the snapshot and nothing"
              echo "else, squashed, and the branch deleted."
            elif [ "$OUTCOME" != "success" ]; then
              echo "Nothing was published: the step that pushes the measurement and opens its"
              echo "pull request did not finish successfully (outcome: \`$OUTCOME\`). Read the"
              echo "report above and the job log; \`limits-observed.json\` on \`main\` is unchanged."
            elif [ "$OPENED" = "true" ]; then
              echo "The rolling branch \`$BRANCH\` was updated and its pull request was left for a"
              echo "person to merge, either because \`WALLS_AUTOMERGE\` is \`off\` or because the run"
              echo "could not merge it."
            else
              echo "This repository does not let GitHub Actions open pull requests, so the branch"
              echo "\`$BRANCH\` was pushed and the pull request is a click:"
              echo
              echo "$COMPARE"
            fi
            echo
            echo "\`limits-observed.json\` is not only a report. The plugin reads it when it"
            echo "starts, so a measurement on \`main\` is the window a host shows for an id"
            echo "\`limits.mjs\` does not name - which is what a model Zen made free after this"
            echo "table was written is. Until it is there, the catalogue's own numbers are what"
            echo "is published for those ids."
          } >> "$GITHUB_STEP_SUMMARY"
